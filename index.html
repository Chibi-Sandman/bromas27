<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meetup Availability (Dec 2026 – Jan 2027)</title>
  <style>
    :root {
      --pine: #164230;
      --pine-dark: #0d291e;
      --berry: #b8292f;
      --cream: #f8faf9;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #52606d;
      --border: #d9e2ec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--pine-dark);
      color: var(--text);
      padding: 24px 16px 48px;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: #fff;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 1.8rem;
    }

    header p {
      margin: 0;
      color: #d9e8e0;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    /* 1. Name Entry */
    .name-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .name-group {
      flex: 1 1 260px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--pine);
      font-size: 0.95rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--pine);
    }

    .btn {
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--pine);
      background: #fff;
      color: var(--pine);
    }

    .btn:hover {
      background: #f0f7f4;
    }

    .btn-danger {
      border-color: var(--berry);
      color: var(--berry);
    }

    .btn-danger:hover {
      background: #fff5f5;
    }

    .helper-text {
      margin: 10px 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* 2. Calendars */
    .months-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .month-box {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .month-title {
      text-align: center;
      margin: 0 0 12px;
      font-size: 1.15rem;
      color: var(--berry);
    }

    .weekdays, .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .weekdays div {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      padding-bottom: 4px;
    }

    .day-btn {
      aspect-ratio: 1 / 1;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .day-btn:hover {
      border-color: var(--pine);
    }

    .day-btn.selected {
      background: var(--pine);
      border-color: var(--pine);
      color: #fff;
    }

    .day-badge {
      font-size: 0.68rem;
      margin-top: 2px;
      color: var(--berry);
      font-weight: 700;
    }

    .day-btn.selected .day-badge {
      color: #ffd166;
    }

    /* 3. Results */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .results-header h2 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--pine);
    }

    .result-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      background: var(--cream);
    }

    .result-row.best {
      border-color: #d4a338;
      background: #fffbeb;
    }

    .date-label {
      font-weight: 700;
      color: var(--pine);
    }

    .count-pill {
      background: var(--berry);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      margin-left: 8px;
    }

    .names-list {
      font-size: 0.9rem;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎄 Meetup Availability Calendar</h1>
      <p>December 1, 2026 – January 31, 2027</p>
    </header>

    <!-- 1. NAME ENTRY -->
    <div class="card">
      <div class="name-row">
        <div class="name-group">
          <label for="person-name">Your Name</label>
          <input type="text" id="person-name" placeholder="Enter your name..." maxlength="40" />
        </div>
        <button type="button" class="btn" id="next-person-btn">+ Next Person</button>
        <button type="button" class="btn btn-danger" id="reset-all-btn">Reset All</button>
      </div>
      <p class="helper-text" id="status-text">Type your name above, then click all days you are free below.</p>
    </div>

    <!-- 2. CALENDAR SELECTION -->
    <div class="card">
      <div class="months-grid" id="calendars"></div>
    </div>

    <!-- 3. RESULTS BELOW -->
    <div class="card">
      <div class="results-header">
        <h2>Best Days to Meet</h2>
        <span id="total-people" style="font-size:0.9rem; color:var(--muted); font-weight:600;"></span>
      </div>
      <div id="results"></div>
    </div>
  </div>

  <script>
    const MONTHS = [
      { year: 2026, month: 11, title: "December 2026", days: 31 },
      { year: 2027, month: 0,  title: "January 2027",  days: 31 }
    ];

    let data = {};
    try {
      data = JSON.parse(localStorage.getItem("simple_meetup_2026") || "{}");
    } catch (e) {
      data = {};
    }

    const nameInput = document.getElementById("person-name");
    const statusText = document.getElementById("status-text");
    const calendarsEl = document.getElementById("calendars");
    const resultsEl = document.getElementById("results");
    const totalPeopleEl = document.getElementById("total-people");

    function save() {
      try {
        localStorage.setItem("simple_meetup_2026", JSON.stringify(data));
      } catch (e) {}
    }

    function currentKey() {
      const raw = nameInput.value.trim();
      return raw ? raw.toLowerCase() : "";
    }

    nameInput.addEventListener("input", () => {
      const key = currentKey();
      if (key && data[key]) {
        data[key].name = nameInput.value.trim();
        save();
      }
      render();
    });

    document.getElementById("next-person-btn").addEventListener("click", () => {
      nameInput.value = "";
      nameInput.focus();
      render();
    });

    document.getElementById("reset-all-btn").addEventListener("click", () => {
      if (confirm("Clear all names and selected dates?")) {
        data = {};
        nameInput.value = "";
        save();
        render();
      }
    });

    function toggleDay(isoDate) {
      const rawName = nameInput.value.trim();
      if (!rawName) {
        alert("Please enter your name at the top first.");
        nameInput.focus();
        return;
      }
      const key = rawName.toLowerCase();
      if (!data[key]) {
        data[key] = { name: rawName, dates: [] };
      } else {
        data[key].name = rawName;
      }

      const list = data[key].dates;
      const idx = list.indexOf(isoDate);
      if (idx === -1) {
        list.push(isoDate);
      } else {
        list.splice(idx, 1);
      }
      list.sort();
      save();
      render();
    }

    function formatDate(iso) {
      const parts = iso.split("-");
      const dt = new Date(Number(parts.at(0)), Number(parts.at(1)) - 1, Number(parts.at(2)));
      return dt.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    }

    function render() {
      const key = currentKey();
      const myDates = (key && data[key]) ? data[key].dates : [];

      if (key) {
        statusText.textContent = `Selecting days for ${nameInput.value.trim()} (${myDates.length} selected)`;
      } else {
        statusText.textContent = "Type your name above, then click all days you are free below.";
      }

      // Build map of date -> list of names
      const dateMap = {};
      const activePeople = Object.values(data).filter(p => p.dates && p.dates.length > 0);
      activePeople.forEach(person => {
        person.dates.forEach(d => {
          if (!dateMap[d]) dateMap[d] = [];
          dateMap[d].push(person.name);
        });
      });

      // Render Calendars
      calendarsEl.innerHTML = "";
      MONTHS.forEach(m => {
        const box = document.createElement("div");
        box.className = "month-box";

        const heading = document.createElement("h3");
        heading.className = "month-title";
        heading.textContent = m.title;
        box.appendChild(heading);

        const wkRow = document.createElement("div");
        wkRow.className = "weekdays";
        ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach(w => {
          const cell = document.createElement("div");
          cell.textContent = w;
          wkRow.appendChild(cell);
        });
        box.appendChild(wkRow);

        const daysGrid = document.createElement("div");
        daysGrid.className = "days";

        const startWeekday = new Date(m.year, m.month, 1).getDay();
        for (let i = 0; i < startWeekday; i++) {
          daysGrid.appendChild(document.createElement("div"));
        }

        for (let day = 1; day <= m.days; day++) {
