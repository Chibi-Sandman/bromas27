<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meetup Availability (Dec 2026 – Jan 2027)</title>
  <style>
    :root {
      --pine: #164230;
      --pine-dark: #0d291e;
      --berry: #b8292f;
      --cream: #f8faf9;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #52606d;
      --border: #d9e2ec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--pine-dark);
      color: var(--text);
      padding: 24px 16px 48px;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: #fff;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 1.8rem;
    }

    header p {
      margin: 0;
      color: #d9e8e0;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    /* 1. Name Entry */
    .name-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .name-group {
      flex: 1 1 260px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--pine);
      font-size: 0.95rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--pine);
    }

    .btn {
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--pine);
      background: #fff;
      color: var(--pine);
      transition: background-color 0.15s ease;
    }

    .btn:hover {
      background: #f0f7f4;
    }

    .btn-primary {
      background: var(--pine);
      color: #fff;
      border-color: var(--pine);
    }

    .btn-primary:hover {
      background: #1f5c43;
    }

    /* Emoji Picker */
    .emoji-section {
      margin-top: 14px;
    }

    .emoji-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .emoji-btn {
      width: 40px;
      height: 40px;
      font-size: 1.25rem;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--cream);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
    }

    .emoji-btn:hover {
      border-color: var(--pine);
      background: #fff;
    }

    .emoji-btn.active {
      border-color: var(--pine);
      background: #e6f2ed;
      box-shadow: 0 0 0 2px rgba(212, 163, 56, 0.45);
      transform: translateY(-1px);
    }

    .helper-text {
      margin: 12px 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* Inline Message Banner (replaces browser alert/confirm) */
    .notice-banner {
      display: none;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fff5f5;
      color: var(--berry);
      border: 1px solid #f5c2c4;
    }

    .notice-banner.success {
      background: #ecfdf5;
      color: #065f46;
      border-color: #a7f3d0;
    }

    .notice-banner.visible {
      display: flex;
    }

    .notice-actions {
      display: flex;
      gap: 8px;
    }

    .notice-btn {
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }

    /* 2. Calendars */
    .months-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .month-box {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .month-title {
      text-align: center;
      margin: 0 0 12px;
      font-size: 1.15rem;
      color: var(--berry);
    }

    .weekdays, .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .weekdays div {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      padding-bottom: 4px;
    }

    .day-btn {
      aspect-ratio: 1 / 1;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px;
      transition: all 0.12s ease;
    }

    .day-btn:hover {
      border-color: var(--pine);
    }

    .day-btn.selected {
      background: var(--pine);
      border-color: #d4a338;
      color: #fff;
    }

    .day-emojis {
      font-size: 0.72rem;
      line-height: 1.1;
      margin-top: 2px;
      min-height: 14px;
      letter-spacing: -1px;
      word-break: break-all;
    }

    /* 3. Results */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .results-header h2 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--pine);
    }

    .result-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      background: var(--cream);
    }

    .result-row.best {
      border-color: #d4a338;
      background: #fffbeb;
    }

    .date-label {
      font-weight: 700;
      color: var(--pine);
    }

    .count-pill {
      background: var(--berry);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      margin-left: 8px;
    }

    .names-list {
      font-size: 0.9rem;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎄 Bromas 2k27 Availability Finder</h1>
      <p>December 1, 2026 – January 31, 2027</p>
    </header>

    <!-- 1. NAME ENTRY, EMOJI SELECTOR & SAVE -->
    <div class="card">
      <div class="name-row">
        <div class="name-group">
          <label for="person-name">Your Name</label>
          <input type="text" id="person-name" placeholder="Enter your name..." maxlength="40" />
        </div>
        <button type="button" class="btn btn-primary" id="save-btn">Save Selections</button>
      </div>

      <div class="emoji-section">
        <label>Pick Your Holiday Icon</label>
        <div class="emoji-grid" id="emoji-grid"></div>
      </div>

      <p class="helper-text" id="status-text">One submission per person — you can return anytime to update your dates.</p>
      <div class="notice-banner" id="notice-banner">
        <span id="notice-msg"></span>
        <div class="notice-actions" id="notice-actions"></div>
      </div>
    </div>

    <!-- 2. CALENDAR SELECTION -->
    <div class="card">
      <div class="months-grid" id="calendars"></div>
    </div>

    <!-- 3. RESULTS BELOW -->
    <div class="card">
      <div class="results-header">
        <h2>Best Days to Meet</h2>
        <span id="total-people" style="font-size:0.9rem; color:var(--muted); font-weight:600;"></span>
      </div>
      <div id="results"></div>
    </div>
  </div>

  <script>
    const MONTHS = [
      { year: 2026, month: 11, title: "December 2026", days: 31 },
      { year: 2027, month: 0,  title: "January 2027",  days: 31 }
    ];

    const EMOJIS = ["🎄", "🎅", "⛄", "🦌", "🎁", "❄️", "🔔", "🍪", "✨", "🥂"];

    // Enforce strictly ONE saved profile per browser/person
    let profile = {
      name: "",
      emoji: EMOJIS[0],
      dates: [],
      hasSaved: false
    };

    try {
      const raw = JSON.parse(localStorage.getItem("simple_meetup_2026") || "null");
      if (raw && typeof raw === "object") {
        if (typeof raw.name === "string" && Array.isArray(raw.dates)) {
          profile = {
            name: raw.name,
            emoji: raw.emoji || EMOJIS[0],
            dates: raw.dates,
            hasSaved: Boolean(raw.hasSaved)
          };
        } else {
          // Migrate legacy multi-entry object into a single profile if present
          const firstEntry = Object.values(raw).find(p => p && typeof p.name === "string");
          if (firstEntry) {
            profile = {
              name: firstEntry.name,
              emoji: firstEntry.emoji || EMOJIS[0],
              dates: Array.isArray(firstEntry.dates) ? firstEntry.dates : [],
              hasSaved: true
            };
          }
        }
      }
    } catch (e) {}

    const nameInput = document.getElementById("person-name");
    const emojiGridEl = document.getElementById("emoji-grid");
    const statusText = document.getElementById("status-text");
    const calendarsEl = document.getElementById("calendars");
    const resultsEl = document.getElementById("results");
    const totalPeopleEl = document.getElementById("total-people");
    const noticeBanner = document.getElementById("notice-banner");
    const noticeMsg = document.getElementById("notice-msg");
    const noticeActions = document.getElementById("notice-actions");

    // Pre-populate saved profile fields on return visits
    nameInput.value = profile.name;

    function showNotice(message, isSuccess = false) {
      noticeMsg.textContent = message;
      noticeActions.innerHTML = "";
      noticeBanner.classList.toggle("success", isSuccess);

      const okBtn = document.createElement("button");
      okBtn.type = "button";
      okBtn.className = "notice-btn";
      okBtn.textContent = "Dismiss";
      okBtn.onclick = hideNotice;
      noticeActions.appendChild(okBtn);

      noticeBanner.classList.add("visible");
    }

    function hideNotice() {
      noticeBanner.classList.remove("visible");
    }

    function persistStorage() {
      try {
        localStorage.setItem("simple_meetup_2026", JSON.stringify(profile));
      } catch (e) {}
    }

    // Editing the name simply updates the single profile's display name
    nameInput.addEventListener("input", () => {
      hideNotice();
      profile.name = nameInput.value.trim();
      if (profile.hasSaved) {
        persistStorage();
      }
      render();
    });

    // Explicit Save button (locks in or updates the single profile)
    document.getElementById("save-btn").addEventListener("click", () => {
      const rawName = nameInput.value.trim();
      if (!rawName) {
        showNotice("Please enter your name before saving.", false);
        nameInput.focus();
        return;
      }

      profile.name = rawName;
      profile.hasSaved = true;
      persistStorage();
      render();
      showNotice(`✅ Saved! Your availability is locked in. You can return here anytime to update your days.`, true);
    });

    function selectEmoji(emoji) {
      profile.emoji = emoji;
      if (profile.hasSaved) {
        persistStorage();
      }
      render();
    }

    function toggleDay(isoDate) {
      const rawName = nameInput.value.trim();
      if (!rawName) {
        showNotice("Please enter your name in the box above first.", false);
        nameInput.focus();
        return;
      }
      hideNotice();
      profile.name = rawName;

      const idx = profile.dates.indexOf(isoDate);
      if (idx === -1) {
        profile.dates.push(isoDate);
      } else {
        profile.dates.splice(idx, 1);
      }
      profile.dates.sort();
      persistStorage();
      render();
    }

    function formatDate(iso) {
      const parts = iso.split("-");
      const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return dt.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    }

    function render() {
      const cleanName = nameInput.value.trim();
      const myDates = profile.dates;

      // Render Emoji Picker
      emojiGridEl.innerHTML = "";
      EMOJIS.forEach(emoji => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "emoji-btn" + (profile.emoji === emoji ? " active" : "");
        btn.textContent = emoji;
        btn.title = `Select ${emoji}`;
        btn.onclick = () => selectEmoji(emoji);
        emojiGridEl.appendChild(btn);
      });

      if (profile.hasSaved && cleanName) {
        statusText.textContent = `Your Saved Availability: ${profile.emoji} ${cleanName} (${myDates.length} ${myDates.length === 1 ? "day" : "days"}). Update your name, icon, or days anytime and click "Save Selections".`;
      } else if (cleanName) {
        statusText.textContent = `Selecting days for ${profile.emoji} ${cleanName} (${myDates.length} selected) — click "Save Selections" when finished.`;
      } else {
        statusText.textContent = "One submission per person — you can return anytime to update your dates.";
      }

      // Render Calendars
      calendarsEl.innerHTML = "";
      MONTHS.forEach(m => {
        const box = document.createElement("div");
        box.className = "month-box";

        const heading = document.createElement("h3");
        heading.className = "month-title";
        heading.textContent = m.title;
        box.appendChild(heading);

        const wkRow = document.createElement("div");
        wkRow.className = "weekdays";
        ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach(w => {
          const cell = document.createElement("div");
          cell.textContent = w;
          wkRow.appendChild(cell);
        });
        box.appendChild(wkRow);

        const daysGrid = document.createElement("div");
        daysGrid.className = "days";

        const startWeekday = new Date(m.year, m.month, 1).getDay();
        for (let i = 0; i < startWeekday; i++) {
          daysGrid.appendChild(document.createElement("div"));
        }

        for (let day = 1; day <= m.days; day++) {
          const mm = String(m.month + 1).padStart(2, "0");
          const dd = String(day).padStart(2, "0");
          const iso = `${m.year}-${mm}-${dd}`;
          const isSelected = myDates.includes(iso);

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "day-btn" + (isSelected ? " selected" : "");
          btn.onclick = () => toggleDay(iso);

          const numSpan = document.createElement("span");
          numSpan.textContent = day;
          btn.appendChild(numSpan);

          const emojiSpan = document.createElement("span");
          emojiSpan.className = "day-emojis";
          if (isSelected) {
            emojiSpan.textContent = profile.emoji;
          }
          btn.appendChild(emojiSpan);

          daysGrid.appendChild(btn);
        }

        box.appendChild(daysGrid);
        calendarsEl.appendChild(box);
      });

      // Render Results for the single saved profile
      const displayName = cleanName || "You";
      const hasAnyDates = myDates.length > 0;
      totalPeopleEl.textContent = hasAnyDates ? "1 submission saved" : "0 submissions yet";
      resultsEl.innerHTML = "";

      if (!hasAnyDates) {
        resultsEl.innerHTML = `<p class="helper-text" style="margin:0;">No dates selected yet.</p>`;
        return;
      }

      myDates.forEach(iso => {
        const row = document.createElement("div");
        row.className = "result-row best";

        const left = document.createElement("div");
        const dateSpan = document.createElement("span");
        dateSpan.className = "date-label";
        dateSpan.textContent = formatDate(iso);

        const pill = document.createElement("span");
        pill.className = "count-pill";
        pill.textContent = "1 free";

        left.appendChild(dateSpan);
        left.appendChild(pill);

        const right = document.createElement("div");
        right.className = "names-list";
        right.textContent = `${profile.emoji} ${displayName}`;

        row.appendChild(left);
        row.appendChild(right);
        resultsEl.appendChild(row);
      });
    }

    render();
  </script>
</body>
</html>
