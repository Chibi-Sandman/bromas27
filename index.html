<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bromas 2k27 Meetup Availability (Dec 2026 – Jan 2027)</title>
  <style>
    :root {
      --pine: #164230;
      --pine-dark: #0d291e;
      --berry: #b8292f;
      --cream: #f8faf9;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #52606d;
      --border: #d9e2ec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--pine-dark);
      color: var(--text);
      padding: 24px 16px 48px;
      overflow-x: hidden;
    }

    #snow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Custom Glowing Christmas Light Cursor (Desktop Pointer Devices) */
    @media (hover: hover) and (pointer: fine) {
      body, a, button, input {
        cursor: none !important;
      }

      #xmas-cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        border: 2px solid #ffffff;
        animation: xmas-bulb-glow 1.6s infinite steps(1);
        transition: width 0.12s ease, height 0.12s ease;
      }

      #xmas-cursor.clicking {
        width: 22px;
        height: 22px;
      }

      .xmas-spark {
        position: fixed;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9998;
        transform: translate(-50%, -50%);
        animation: spark-fade 0.65s ease-out forwards;
      }
    }

    @media (hover: none) or (pointer: coarse) {
      #xmas-cursor {
        display: none;
      }
    }

    @keyframes xmas-bulb-glow {
      0%   { background: #ff2a2a; box-shadow: 0 0 10px #ff2a2a, 0 0 20px #ff2a2a; }
      25%  { background: #2ecc71; box-shadow: 0 0 10px #2ecc71, 0 0 20px #2ecc71; }
      50%  { background: #ffd166; box-shadow: 0 0 10px #ffd166, 0 0 20px #ffd166; }
      75%  { background: #38bdf8; box-shadow: 0 0 10px #38bdf8, 0 0 20px #38bdf8; }
    }

    @keyframes spark-fade {
      0%   { opacity: 0.95; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -20%) scale(0.2); }
    }

    @keyframes xmas-caret {
      0%, 100% { caret-color: #d90429; }
      33%      { caret-color: #16a34a; }
      66%      { caret-color: #eab308; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 880px;
      margin: 0 auto;
    }

      text-align: center;
      color: #fff;
      margin-bottom: 2
